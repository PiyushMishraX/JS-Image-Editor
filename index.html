<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Editor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <!-- <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" /> -->
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="left">
          <div class="top">
            <label for="image-input" class="btn">
              Choose image
              <input type="file" id="image-input" accept="image/*" hidden />
              <!-- hide choose file square -->
            </label>
            <button class="btn" id="reset-btn">Reset</button>
            <button class="btn" id="download-btn">Download</button>
          </div>
          <div class="bottom">
            <div class="placeholder">
              <!-- using icon as placeholder from remix icon .com -->
               <i class="ri-image-line"></i>
               <p>No image is choosen</p>
            </div>
            <canvas id="image-canvas"></canvas>
          </div>
        </div>
        <div class="right">
            <h2>Filters</h2>
            <div class="filters">

                <!-- now we got blueprint of afilter we will add others through JS -->
                <!-- <div class="filter">
                    <p>Brightness</p>
                    <input name="brightness" value="100" type="range" min="0" max="200">
                </div>
                <div class="filter">
                    <p>Brightness</p>
                    <input name="brightness" value="100" type="range" min="0" max="200">
                </div> -->

            </div>
            <h2>Presets</h2>
            <div class="presets">

            </div>
        </div>
      </section>
    </main>
    <!-- <script src="script.js"></script> -->
    <script src="scripts/script.js"></script>
  </body>
</html>
